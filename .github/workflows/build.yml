# Builds the launchpad and publishes it.
#
#   • Push to main  → type-check + build, then deploy to GitHub Pages.
#   • Pull request  → type-check + build only, to catch problems before merging.
#   • Every run     → the built page (index.html + launchpad.config.js + favicon) is attached
#                     as a "launchpad" artifact: download it from the run's summary page and
#                     open index.html straight from disk.
#
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # superseded PR builds can stop early; a deploy in progress is left to finish
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # the repo has no package-lock.json, so `npm install` rather than `npm ci`
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Upload the built page
        uses: actions/upload-artifact@v4
        with:
          name: launchpad
          path: dist/
          if-no-files-found: error

      - name: Package for GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
